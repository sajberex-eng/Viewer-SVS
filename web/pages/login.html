<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Вьювер гистосканов</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-page">
  <form class="login-card" id="loginForm">
    <h1 data-i18n="login.heading"></h1>
    <label><span data-i18n="login.login"></span>
      <input type="text" id="login" name="login" autocomplete="username" required autofocus>
    </label>
    <label><span data-i18n="login.password"></span>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </label>
    <p class="login-error" id="loginError" role="alert"></p>
    <button class="btn btn-primary" type="submit" data-i18n="login.submit"></button>
    <p class="muted" data-i18n="login.note"></p>
  </form>
  <script type="module" src="/static/js/login.js"></script>
</body>
</html>
