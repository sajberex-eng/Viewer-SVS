<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HemCenterHistoDigital</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
  <script src="/static/js/theme-init.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="viewer-page">
  <header class="topbar">
    <a href="/" class="topbar-logo-link" data-i18n-tip="top.catalog.tip"><img class="topbar-logo" src="/static/img/logo.svg" alt=""></a>
    <!-- Паспорт открытого скана: случай (папка), скан, окраска, увеличение,
         размер пикселя. Щелчок по случаю открывает папку в каталоге (ИН-3) -->
    <div class="topbar-slide">
      <a class="topbar-case" id="slidePath" hidden data-i18n-tip="top.path.tip"></a>
      <h1 class="topbar-title"><span class="topbar-label" data-i18n="top.scan"></span> <span id="slideTitle"></span></h1>
      <span class="topbar-meta" id="slideMeta"></span>
    </div>
    <!-- Увеличения в шапке (замечание заказчика 2026-10-22: поле просмотра не
         загромождать). Одни на весь экран: при сравнении задают масштаб обеим
         половинам. На телефоне этот блок опускается в ряд внизу (М-2) -->
    <div class="topbar-zoom" id="topbarZoom" role="toolbar">
      <output class="topbar-mag" id="zoomCurrent" data-i18n-tip="zoom.current.tip"></output>
      <div class="zoom-buttons" id="zoomButtons"></div>
    </div>
    <nav class="topbar-actions" id="topbarActions">
      <!-- Кнопки идут значками (В-1); полное название остаётся в подсказке и в
           aria-label (В-5). Те, что не поместились, уходят в меню «ещё» (В-4) -->
      <button class="btn btn-icon" id="btnRuler" data-icon="ruler" data-i18n-label="ruler.title" data-i18n-tip="ruler.tip"></button>
      <div class="popover-anchor" id="rotateAnchor">
        <button class="btn btn-icon" id="btnRotate" aria-expanded="false" aria-controls="rotatePopover"
                data-icon="rotate" data-i18n-label="rotate.title" data-i18n-tip="rotate.tip"></button>
        <div class="popover rotate-popover" id="rotatePopover" hidden>
          <div class="rotate-row">
            <label for="rotateNumber" data-i18n="rotate.angle"></label>
            <input type="number" id="rotateNumber" min="-180" max="180" step="1">
            <span>°</span>
          </div>
          <input type="range" id="rotateSlider" min="-180" max="180" step="1" data-i18n-tip="rotate.slider.tip">
          <div class="rotate-row rotate-steps">
            <button class="btn" id="rotateMinus90">−90°</button>
            <button class="btn" id="rotateZero">0°</button>
            <button class="btn" id="rotatePlus90">+90°</button>
          </div>
          <label class="check"><input type="checkbox" id="rotateFlip"> <span data-i18n="rotate.flip"></span></label>
          <p class="muted" data-i18n="rotate.flipHint"></p>
        </div>
      </div>
      <button class="btn btn-icon" id="btnAnnotations" aria-expanded="false" aria-controls="annotPanel" data-icon="annotations" data-i18n-label="top.annotations" data-i18n-tip="top.annotations.tip">
        <span class="annot-count" id="annotCount" hidden></span>
      </button>
      <button class="btn btn-icon" id="btnAdjust" aria-expanded="false" aria-controls="adjustPanel" data-icon="adjust" data-i18n-label="top.adjust" data-i18n-tip="top.adjust.tip">
        <span class="saved-dot" id="adjustSavedDot" hidden data-i18n-tip="top.adjust.saved"></span>
      </button>
      <!-- Клеточность костного мозга (КЛ-1): только у сканов H&E (ОК-4) -->
      <button class="btn btn-icon" id="btnCellularity" hidden aria-expanded="false" aria-controls="cellPanel"
              data-icon="cellularity" data-i18n-label="cell.title" data-i18n-tip="cell.tip"></button>
      <!-- Привязка по ориентирам нужна только при сравнении (С-10) -->
      <button class="btn btn-icon" id="btnBind" hidden data-icon="bind" data-i18n-label="bind.title" data-i18n-tip="bind.tip"></button>
      <button class="btn btn-icon" id="btnLabel" data-icon="label" data-i18n-label="top.label" data-i18n-tip="top.label.tip"></button>
      <button class="btn btn-icon" id="btnReset" data-icon="reset" data-i18n-label="top.reset" data-i18n-tip="top.reset.tip"></button>
      <div class="popover-anchor" id="linkAnchor">
        <button class="btn btn-icon" id="btnLink" hidden aria-expanded="false" aria-controls="linkPopover" data-icon="share" data-i18n-label="top.link" data-i18n-tip="top.link.tip"></button>
        <div class="popover" id="linkPopover" hidden>
          <input type="text" id="linkUrl" readonly aria-label="URL">
          <label class="check"><input type="checkbox" id="linkWithAdjust"> <span data-i18n="link.withAdjust"></span></label>
          <div class="popover-row">
            <span class="muted" data-i18n="link.note"></span>
            <button class="btn btn-primary" id="linkCopy" data-i18n="link.copy"></button>
          </div>
        </div>
      </div>
      <!-- Снимок поля зрения в буфер обмена (2026-10-22); участок — из меню по правой кнопке -->
      <button class="btn btn-icon no-phone" id="btnSnapshot" data-icon="camera" data-i18n-label="top.snapshot" data-i18n-tip="top.snapshot.tip"></button>
      <button class="btn btn-icon" id="btnCompare" data-icon="compare" data-i18n-label="top.compare" data-i18n-tip="top.compare.tip"></button>
      <button class="btn btn-icon" id="btnLink2" hidden data-icon="linkPanes" data-i18n-label="compare.link" data-i18n-tip="compare.link.tip"></button>
      <button class="btn btn-icon" id="btnSwap" hidden data-icon="swap" data-i18n-label="compare.swap" data-i18n-tip="compare.swap.tip"></button>
      <button class="btn btn-icon" id="btnSingle" hidden data-icon="single" data-i18n-label="compare.single" data-i18n-tip="compare.single.tip"></button>
      <button class="btn btn-icon" id="btnInfo" data-icon="info" data-i18n-label="top.info" data-i18n-tip="top.info.tip"></button>
      <button class="btn btn-icon" id="btnHelp" data-icon="help" data-i18n-label="top.help" data-i18n-tip="top.help.tip"></button>
      <!-- Кнопки, которым не хватило ширины, переезжают сюда (В-4) -->
      <div class="popover-anchor topbar-more" id="moreAnchor" hidden>
        <button class="btn btn-icon" id="btnMore" aria-expanded="false" aria-controls="morePopover" data-icon="more" data-i18n-label="top.more" data-i18n-tip="top.more.tip"></button>
        <div class="popover popover-menu" id="morePopover" hidden></div>
      </div>
    </nav>
    <div class="topbar-user">
      <button class="btn btn-icon" type="button" data-theme-toggle></button>
      <!-- Увеличение и пометка «отражено» живут здесь, а не в нижней строке:
           нижняя строка крала поле зрения (замечание патолога 2026-09-24) -->
      <span class="flip-mark" id="statusFlip" hidden data-i18n="flip.mark" data-i18n-tip="flip.mark.tip"></span>
      <span class="user-badge no-desktop" id="userName"></span>
      <button class="btn btn-icon no-desktop" id="btnLogout" data-icon="logout" data-i18n-label="common.logout" data-i18n-tip="common.logout"></button>
      <a class="btn btn-icon" href="/" data-icon="close" data-i18n-label="top.catalog" data-i18n-tip="top.close.tip"></a>
    </div>
  </header>

  <div class="workspace">
    <aside class="slides-panel" id="slidesPanel">
      <div class="slides-panel-head">
        <button class="icon-btn" id="slidesToggle" aria-expanded="true" aria-controls="slidesList" data-i18n-tip="slides.toggle.tip">«</button>
        <span class="slides-panel-title" id="slidesTitle"></span>
        <span class="slides-panel-keys muted">PgDn / PgUp</span>
      </div>
      <ul class="slides-list" id="slidesList"></ul>
    </aside>

    <!-- Половины экрана создаются из шаблона: одна в обычном режиме, две при сравнении -->
    <div class="panes-wrap">
      <!-- Круглые кнопки поля просмотра, как в образце: действуют на обе половины -->
      <div class="nav-buttons" role="toolbar">
        <button class="round-btn" type="button" id="navZoomIn" data-icon="zoomIn" data-i18n-tip="nav.zoomIn.tip"></button>
        <button class="round-btn" type="button" id="navZoomOut" data-icon="zoomOut" data-i18n-tip="nav.zoomOut.tip"></button>
        <button class="round-btn" type="button" id="navHome" data-icon="home" data-i18n-tip="nav.home.tip"></button>
        <button class="round-btn" type="button" id="btnFullscreen" data-icon="fullscreen" data-i18n-tip="top.fullscreen.tip"></button>
      </div>
      <div class="panes" id="panes"></div>
      <!-- Сообщения и подсказки всплывают над препаратом и исчезают сами: нижней строки больше нет -->
      <div class="toast" id="statusTiles" aria-live="polite" hidden></div>
      <!-- Меню по правой кнопке на препарате (Т-5): быстрый доступ к рулетке
           и инструментам разметки без похода к панелям -->
      <div class="popover popover-menu stage-menu" id="stageMenu" hidden>
        <button class="btn" id="menuRuler" data-i18n="ruler.title"></button>
        <button class="btn" id="menuPoint" data-i18n="annot.tool.point"></button>
        <button class="btn" id="menuPolygon" data-i18n="annot.tool.polygon"></button>
        <button class="btn" id="menuSnapshot" data-i18n="snapshot.menu"></button>
      </div>
      <!-- Привязка по ориентирам: подсказка и кнопки на время разметки (С-10) -->
      <div class="bind-bar" id="bindBar" hidden>
        <span class="bind-hint" id="bindHint" aria-live="polite"></span>
        <button class="btn" id="bindUndo" data-i18n="bind.undo"></button>
        <button class="btn" id="bindCancel" data-i18n="common.cancel"></button>
        <button class="btn btn-primary" id="bindApply" data-i18n="bind.apply"></button>
      </div>

      <!-- Плавающие панели лежат поверх препарата и не сдвигают его
           (замечание заказчика 2026-10-22); тянутся за заголовок -->
      <aside class="annot-panel" id="annotPanel" hidden>
        <div class="adjust-head">
          <h2 data-i18n="annot.heading"></h2>
          <button class="icon-btn" id="annotClose" data-i18n-tip="adjust.close.tip">×</button>
        </div>
        <label class="check annot-show">
          <input type="checkbox" id="annotVisible" checked>
          <span data-i18n="annot.show"></span>
        </label>
        <div class="annot-tools" id="annotTools" hidden>
          <button class="btn" id="toolPoint" data-i18n="annot.tool.point" data-i18n-tip="annot.tool.point.tip"></button>
          <button class="btn" id="toolPolygon" data-i18n="annot.tool.polygon" data-i18n-tip="annot.tool.polygon.tip"></button>
        </div>
        <p class="annot-hint muted" id="annotHint" aria-live="polite"></p>
        <ul class="annot-list" id="annotList"></ul>
        <p class="muted" id="annotEmpty" data-i18n="annot.empty"></p>
      </aside>
      <aside class="annot-panel cell-panel" id="cellPanel" hidden>
        <div class="adjust-head">
          <h2 data-i18n="cell.title"></h2>
          <button class="icon-btn" id="cellClose" data-i18n-tip="adjust.close.tip">×</button>
        </div>
        <div class="cell-headline">
          <div class="cell-method-label" data-i18n="cell.method.algorithm"></div>
          <div class="cell-big" id="cellBig">—</div>
          <div class="cell-sub" id="cellSub"></div>
          <div class="cell-progress" id="cellProgress" hidden><div class="cell-progress-bar" id="cellProgressBar"></div></div>
          <p class="cell-state" id="cellState" aria-live="polite"></p>
          <p class="cell-stale" id="cellStale" hidden data-i18n="cell.stale"></p>
          <ul class="cell-warnings" id="cellWarnings" hidden></ul>
          <div class="annot-tools cell-edit">
            <button class="btn btn-primary" id="cellRun" data-i18n="cell.run" data-i18n-tip="cell.run.tip"></button>
            <button class="btn" id="cellCancel" hidden data-i18n="common.cancel"></button>
          </div>
          <p class="muted" id="cellNoRights" hidden data-i18n="cell.noRights"></p>
          <label class="check cell-masks-toggle" id="cellContoursRow" hidden><input type="checkbox" id="cellContours" checked> <span data-i18n="cell.contours.show"></span></label>
          <label class="check cell-masks-toggle" id="cellMasksRow" hidden><input type="checkbox" id="cellMasks" checked> <span data-i18n="cell.masks"></span></label>
          <!-- Второй способ: оценка моделью с картинкой по обзору фрагмента и двум участкам ×20 (решение и промт заказчика 2026-09-24) -->
          <div class="cell-ai" id="cellAi" hidden>
            <div class="cell-method-label" data-i18n="cell.method.ai"></div>
            <div class="cell-big cell-big-ai" id="cellAiBig">—</div>
            <div class="cell-sub" id="cellAiSub"></div>
            <div class="cell-progress" id="cellAiProgress" hidden><div class="cell-progress-bar" id="cellAiProgressBar"></div></div>
            <p class="cell-state" id="cellAiState" aria-live="polite"></p>
            <div class="cell-ai-text" id="cellAiText" hidden></div>
            <p class="cell-stale" id="cellAiStale" hidden data-i18n="cell.stale"></p>
            <div class="annot-tools cell-edit">
              <button class="btn" id="cellAiRun" data-i18n="cell.ai.run" data-i18n-tip="cell.ai.run.tip"></button>
              <button class="btn" id="cellAiCancel" hidden data-i18n="common.cancel"></button>
            </div>
          </div>
          <p class="muted cell-note" data-i18n="cell.note"></p>
        </div>

        <details class="cell-details" id="cellDetails">
          <summary data-i18n="cell.details"></summary>
          <h3 class="cell-h" data-i18n="cell.contours"></h3>
          <div class="annot-tools cell-edit">
            <button class="btn" id="cellToolTissue" data-i18n="cell.contour.tissue" data-i18n-tip="cell.tool.tissue.tip"></button>
            <button class="btn" id="cellToolArtifact" data-i18n="cell.contour.artifact" data-i18n-tip="cell.tool.artifact.tip"></button>
          </div>
          <div class="annot-tools cell-edit">
            <button class="btn" id="cellPropose" data-i18n="cell.propose" data-i18n-tip="cell.propose.tip"></button>
            <button class="btn" id="cellClearContours" hidden data-i18n="cell.clear" data-i18n-tip="cell.clear.tip"></button>
          </div>
          <ul class="annot-list" id="cellContours"></ul>
          <p class="muted" id="cellContoursEmpty" data-i18n="cell.contours.empty"></p>

          <div id="cellRunBlock" hidden>
            <h3 class="cell-h" data-i18n="cell.run.heading"></h3>
            <p class="muted" id="cellRunMeta"></p>
            <div id="cellResult" hidden>
              <label class="cell-opacity"><span data-i18n="cell.opacity"></span>
                <input type="range" id="cellOpacity" min="10" max="100" step="5"></label>
              <div class="cell-legend" id="cellLegend"></div>
              <table class="cell-table" id="cellTable"></table>
              <button class="btn cell-edit" id="cellDelete" data-i18n="cell.delete" data-i18n-tip="cell.delete.tip"></button>
            </div>
            <button class="btn" id="cellExport" hidden data-i18n="cell.export" data-i18n-tip="cell.export.tip"></button>
          </div>

          <div id="cellAiBlock" hidden>
            <h3 class="cell-h" data-i18n="cell.ai.heading"></h3>
            <p class="muted" id="cellAiMeta"></p>
            <ul class="annot-list" id="cellAiFields"></ul>
            <button class="btn cell-edit" id="cellAiDelete" data-i18n="cell.ai.delete" data-i18n-tip="cell.delete.tip"></button>
          </div>
        </details>
      </aside>
      <aside class="adjust-panel" id="adjustPanel" hidden>
        <div class="adjust-head">
          <h2 data-i18n="adjust.heading"></h2>
          <span class="muted" id="adjustTarget" hidden></span>
          <button class="icon-btn" id="adjustClose" data-i18n-tip="adjust.close.tip">×</button>
        </div>
        <div class="adjust-row adjust-row-preset">
          <label for="adjustPreset" data-i18n="adjust.preset"></label>
          <select id="adjustPreset">
            <option value="custom" data-i18n="adjust.preset.custom" hidden></option>
            <option value="original" data-i18n="adjust.preset.original"></option>
            <option value="pale" data-i18n="adjust.preset.pale"></option>
            <option value="overstained" data-i18n="adjust.preset.overstained"></option>
          </select>
        </div>
        <!-- Профиль сканера из файла: по умолчанию включён, если он есть (решение заказчика 2026-09-29) -->
        <label class="adjust-check"><input type="checkbox" id="adjustProfile" disabled><span data-i18n="adjust.profile"></span></label>
        <!-- Гистограмма и уровни (раздел 7.1 ТЗ, этап 12): маркеры и поля строит adjust-panel.js -->
        <canvas class="adjust-histogram" id="adjustHistogram" width="276" height="80" data-i18n-tip="adjust.histogram.tip"></canvas>
        <div class="levels" id="adjustLevels" role="group"></div>
        <div class="levels-fields" id="adjustLevelFields"></div>
        <div class="adjust-actions">
          <button class="btn" id="adjustAuto" data-i18n="adjust.auto" data-i18n-tip="adjust.auto.tip"></button>
          <!-- Пипетка — значком (просьба заказчика 2026-09-29), название в подсказке -->
          <button class="btn btn-icon" id="adjustPipette" data-icon="pipette" data-i18n-label="adjust.pipette" data-i18n-tip="adjust.pipette.tip"></button>
          <button class="btn" id="adjustCompare" data-i18n="adjust.compare" data-i18n-tip="adjust.compare.tip"></button>
          <button class="btn" id="adjustResetAll" data-i18n="adjust.resetAll" data-i18n-tip="adjust.resetAll.tip"></button>
          <button class="btn" id="adjustBoth" hidden data-i18n="adjust.applyBoth" data-i18n-tip="adjust.applyBoth.tip"></button>
        </div>
        <p class="adjust-hint" id="adjustHint" aria-live="polite"></p>
        <details class="adjust-more" open>
          <summary data-i18n="adjust.more"></summary>
          <div id="adjustSliders"></div>
          <div class="adjust-row adjust-row-preset">
            <label for="adjustStain" data-i18n="adjust.stain"></label>
            <select id="adjustStain">
              <option value="0" data-i18n="adjust.stain.all"></option>
              <option value="1" data-i18n="adjust.stain.h"></option>
              <option value="2" data-i18n="adjust.stain.e"></option>
            </select>
          </div>
          <!-- Резкость High Pass (документ заказчика 2026-10-22): как в Photoshop —
               копия с выделенными границами накладывается на кадр -->
          <div class="adjust-sharpen" id="adjustSharpenBlock">
            <label class="adjust-check adjust-sharpen-head" data-i18n-tip="adjust.sharpen.tip">
              <input type="checkbox" id="adjustSharpen">
              <span data-i18n="adjust.sharpen"></span>
              <span class="adjust-sharpen-state" id="adjustSharpenState"></span>
            </label>
            <div id="adjustSharpenRows"></div>
            <div class="adjust-row adjust-row-preset">
              <label for="adjustSharpMode" data-i18n="adjust.sharpMode"></label>
              <select id="adjustSharpMode">
                <option value="0">Overlay</option>
                <option value="1">Soft Light</option>
                <option value="2">Multiply</option>
              </select>
            </div>
          </div>
          <p class="muted" data-i18n="adjust.order"></p>
        </details>
      </aside>
    </div>

    <!-- Аннотации: показ, инструменты (только патологам) и список (этап 9) -->

    <!-- Клеточность (этап 11): сверху одно число, всё остальное под «Подробнее»
         (замечания патолога 2026-09-24: «нажал кнопку — получил результат») -->

  </div>


  <template id="paneTemplate">
    <section class="pane">
      <div class="pane-head">
        <span class="pane-title" data-role="title"></span>
        <!-- Отражённый скан помечен словом: на снимке экрана его иначе не отличить (Т-3) -->
        <span class="flip-mark" data-role="flipMark" hidden data-i18n="flip.mark" data-i18n-tip="flip.mark.tip"></span>
        <a class="pane-path" data-role="path" hidden data-i18n-tip="top.path.tip"></a>
        <output class="pane-zoom" data-role="zoomCurrent" data-i18n-tip="zoom.current.tip"></output>
        <button class="icon-btn" data-role="paneLabel" hidden data-i18n-tip="top.label.tip">🏷</button>
        <button class="icon-btn" data-role="paneClose" hidden data-i18n-tip="compare.close.tip">×</button>
      </div>
      <main class="stage" data-role="stage">
        <div class="osd" data-role="osd"></div>

        <!-- Мини-карта: заголовок тянется мышью в любое место поля, кнопка сворачивает -->
        <div class="minimap" data-role="minimap">
          <div class="minimap-head" data-role="minimapHead">
            <span class="minimap-title" data-i18n="minimap.title"></span>
            <button class="minimap-toggle" data-role="minimapToggle" aria-expanded="true" data-i18n-tip="minimap.toggle.tip">▾</button>
          </div>
          <div class="minimap-view" data-role="navigator"></div>
        </div>

        <aside class="label-panel" data-role="labelPanel" hidden>
          <div class="label-head" data-role="labelHead">
            <span data-i18n="label.heading"></span>
            <button class="icon-btn" data-role="labelRotate" data-i18n-tip="label.rotate.tip">⟳</button>
            <button class="icon-btn" data-role="labelClose" data-i18n-tip="label.close.tip">×</button>
          </div>
          <div class="label-frame" data-role="labelFrame">
            <img class="label-image" data-role="labelImage" alt="">
          </div>
          <p class="label-error muted" data-role="labelError" hidden></p>
        </aside>

        <div class="scalebar" data-role="scalebar" hidden>
          <div class="scalebar-line" data-role="scalebarLine"></div>
          <span data-role="scalebarLabel"></span>
        </div>

        <div class="stage-message" data-role="stageMessage" role="alert" hidden>
          <p data-role="stageMessageText"></p>
          <button class="btn btn-primary" data-role="stageRetry" data-i18n="viewer.retry"></button>
        </div>
      </main>
    </section>
  </template>
