# Конфигурация вьювера. Скопируйте в config.yaml или укажите путь в переменной VIEWER_CONFIG.
# Секреты сюда не пишутся: ключ подписи сессий задаётся переменной окружения VIEWER_SECRET_KEY
# (если её нет, ключ создаётся в data/secret.key).

storage:
  type: local            # local: папка сканов на диске сервера; s3 появится на необязательном этапе 3
  root: "/mnt/slides"    # корень хранилища; относительный путь считается от папки проекта
  recursive: false       # искать сканы во вложенных папках

tiles:
  tile_size: 510         # размер тайла DeepZoom без перекрытия; с overlap 1 получается 512 px
  overlap: 1
  jpeg_quality: 80

cache:
  max_gb: 20             # лимит дискового кэша тайлов, вытеснение по давности использования

auth:
  https_only: true       # cookie сессии только по HTTPS; для локального запуска по http поставьте false
  session_hours: 12

data_dir: data           # база каталога, кэш тайлов и миниатюр
sync_minutes: 10         # как часто сверять каталог с хранилищем
open_slides: 8           # сколько слайдов держать открытыми одновременно
