# Конфигурация вьювера. Скопируйте в config.yaml или укажите путь в переменной VIEWER_CONFIG.
# Секреты сюда не пишутся: ключ подписи сессий задаётся переменной окружения VIEWER_SECRET_KEY
# (если её нет, ключ создаётся в data/secret.key).

storage:
  type: local              # local: папка хранилища на диске сервера; s3 остаётся возможным этапом
  root: "./data/slides"    # корень хранилища; относительный путь считается от папки проекта
  reserve_gb: 2            # столько места на диске остаётся незанятым: ниже порога загрузка не начинается
  warn_free_gb: 4          # при остатке меньше этого администратор видит предупреждение
  max_upload_gb: 4         # предельный размер одного файла

# Папкой хранилища управляет только приложение: сканы загружает администратор через браузер,
# файлы лежат под внутренними идентификаторами. Класть файлы туда вручную не нужно.

tiles:
  tile_size: 510           # размер тайла DeepZoom без перекрытия; с overlap 1 получается 512 px
  overlap: 1
  jpeg_quality: 80

cache:
  max_gb: 2                # лимит дискового кэша тайлов, вытеснение по давности использования

auth:
  https_only: true         # cookie сессии только по HTTPS; для локального запуска по http поставьте false
  session_hours: 12

data_dir: data             # база каталога, кэш тайлов и миниатюр
check_minutes: 30          # как часто сверять каталог с хранилищем (пропавшие файлы)
open_slides: 4             # сколько слайдов держать открытыми одновременно (сервер: 2 ГБ ОЗУ)
