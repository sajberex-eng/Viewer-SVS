# Развёртывание на одном VPS: вьювер и обратный прокси с HTTPS.
# Перед запуском создайте рядом файл .env (см. README, раздел «Развёртывание»)
# и config.yaml. Сканы загружает администратор через веб-интерфейс, поэтому
# отдельная папка на хосте не монтируется: хранилище лежит в томе viewer-data.
services:
  viewer:
    build: .
    restart: unless-stopped
    environment:
      VIEWER_SECRET_KEY: ${VIEWER_SECRET_KEY:?задайте VIEWER_SECRET_KEY в .env}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - viewer-data:/app/data
    expose:
      - "8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }  # диск 30 ГБ: журналы не должны его съесть

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      # IP-адрес сервера, пока нет домена; потом доменное имя
      VIEWER_HOST: ${VIEWER_HOST:?задайте VIEWER_HOST в .env}
      # internal — самоподписанный сертификат Caddy; acme — сертификат Let's Encrypt
      VIEWER_TLS: ${VIEWER_TLS:-internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  viewer-data:
  caddy-data:
  caddy-config:
